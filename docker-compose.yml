services:
  postgres:
    image: postgres:16
    container_name: postgres_aplicacao
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_aplicacao
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
